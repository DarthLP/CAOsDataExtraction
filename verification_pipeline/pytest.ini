[pytest]
# testpaths=qa keeps bare "pytest qa -q" at the 152-test regression baseline
# (CLAUDE.md Sec.3). The 4-tier E2E acceptance suite lives in tests_e2e/ and is
# run separately: pytest tests_e2e -q.
testpaths = qa
markers =
    tier1: Tier 1 Canonical Data Artifacts Verification
    tier2: Tier 2 Codebase Invariants Verification
    tier3: Tier 3 Cross-Pipeline Integration Verification
    tier4: Tier 4 Real-World Acceptance Verification
    e2e: End-to-end replication verification suite
